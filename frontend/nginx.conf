server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Nginx 默认只允许 1MB 请求体，而这里图片上传限制 5MB、题目导入限制 10MB。
    # 不放开的话大文件会被 Nginx 直接返回 413，请求根本到不了后端 ——
    # 表现就是「前端提示导入失败/上传失败，后端日志里什么都没有」。
    client_max_body_size 20m;

    # 大文件上传别让 Nginx 先缓冲整个请求体
    proxy_request_buffering off;

    # Vue Router 的 history 模式：所有未匹配的路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 把 /api 转发到后端容器
    # "backend" 是 docker-compose 里的服务名
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 需要关闭缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # 把 /uploads 转发到后端容器（图片静态资源）
    location /uploads/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}