services:
  # ==================== MySQL ====================
  db:
    image: mysql:8.0
    container_name: cuoti-db
    restart: unless-stopped
    environment:
      # `:?` 是 compose 的"必填"语法：变量没设就直接报错并打印这句话，
      # 而不是像 `${DB_PASSWORD}` 那样悄悄替换成空字符串，
      # 让 MySQL 容器以 "MYSQL_ROOT_PASSWORD 不能为空" 的方式失败（报错点离原因很远）。
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请先 cp .env.example .env 并设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-cuoti_login}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 本地调试时可连，生产可删掉这两行
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ==================== Redis ====================
  # 只做缓存，不做持久化数据源，所以关掉 RDB/AOF：
  # 缓存丢了会自己回源重建，没必要为了缓存牺牲写性能。
  # maxmemory + allkeys-lru：内存到顶时优先淘汰最久没用的 key，
  # 避免 Redis 被写满以后开始报 OOM。
  redis:
    image: redis:7-alpine
    container_name: cuoti-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ==================== 后端 ====================
  backend:
    build:
      # 本仓库是 backend/ + frontend/ 两层，后端根在 backend/，
      # 所以 context 必须是 ./backend（Dockerfile、requirements.txt、app/ 都在那一层）。
      # 这里曾经被误改成 `.`：那是把 backend 的内容压平到仓库根之后产生的错觉，
      # 真实的仓库根上并没有 app/ 和 requirements.txt，`context: .` 反而会
      # `failed to read dockerfile: Dockerfile: no such file or directory`。
      context: ./backend
      dockerfile: Dockerfile
    container_name: cuoti-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 让容器里能用 host.docker.internal 访问宿主机的 Ollama。
    # Docker Desktop（Windows / macOS）自带这个域名；Linux（含阿里云 ECS）上
    # 必须显式映射到 docker 网桥网关，否则 AI 接口连不上宿主机模型。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请先 cp .env.example .env 并设置 DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cuoti_login}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?请先 cp .env.example .env 并设置 JWT_SECRET_KEY}
      JWT_EXPIRE_SECONDS: 3600
      CODE_EXPIRE_SECONDS: 300
      APP_ENV: production
      # 生产环境不回显验证码（`auth.echo_code_enabled()` 本来也会因为
      # APP_ENV=production 而关掉，这里再显式写一遍，避免有人改了 APP_ENV 就意外打开）。
      AUTH_ECHO_CODE: "0"
      # 生产环境要求登录才能读 /uploads 图片（图片用 HttpOnly cookie 鉴权）。
      UPLOAD_REQUIRE_AUTH: "1"
      # ---------- 模型服务：ollama 或 bailian ----------
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      AI_API_BASE: ${AI_API_BASE:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      BAILIAN_EMBED_MODEL: ${BAILIAN_EMBED_MODEL:-text-embedding-v3}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 10
      IMPORT_CHUNK_SIZE: 500
    ports:
      - "3000:3000"
    volumes:
      # 上传的图片挂载出来，容器重启不丢
      - uploads_data:/app/uploads
    healthcheck:
      # 不用 curl：python:3.12-slim 里没有 curl，健康检查会永远 unhealthy。
      # 直接用解释器本身发一个请求，零额外依赖。
      test:
        - CMD
        - python
        - -c
        - |
          import sys, urllib.request
          try:
              code = urllib.request.urlopen("http://127.0.0.1:3000/", timeout=3).status
          except Exception:
              sys.exit(1)
          sys.exit(0 if code == 200 else 1)
      interval: 10s
      timeout: 5s
      retries: 12
      # 首次启动要建表（create_all），给足时间，别一上来就判死
      start_period: 30s

  # ==================== 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cuoti-frontend
    restart: unless-stopped
    depends_on:
      # 等后端真的能响应再起 nginx：否则首屏会拿到一堆 502，
      # 用户以为部署失败（其实只是后端还在跑 create_all）。
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads_data: