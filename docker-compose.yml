services:
  # ==================== MySQL ====================
  db:
    image: mysql:8.0
    container_name: cuoti-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      # 本地调试时可连，生产可删掉这两行
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ==================== Redis ====================
  # 只做缓存，不做持久化数据源，所以关掉 RDB/AOF：
  # 缓存丢了会自己回源重建，没必要为了缓存牺牲写性能。
  # maxmemory + allkeys-lru：内存到顶时优先淘汰最久没用的 key，
  # 避免 Redis 被写满以后开始报 OOM。
  redis:
    image: redis:7-alpine
    container_name: cuoti-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 512mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ==================== 后端 ====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cuoti-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 让容器里能用 host.docker.internal 访问宿主机的 Ollama。
    # Docker Desktop（Windows / macOS）自带这个域名；Linux（含阿里云 ECS）上
    # 必须显式映射到 docker 网桥网关，否则 AI 接口连不上宿主机模型。
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_EXPIRE_SECONDS: 3600
      CODE_EXPIRE_SECONDS: 300
      APP_ENV: production
      # ---------- 模型服务：ollama 或 bailian ----------
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      AI_API_BASE: ${AI_API_BASE:-http://host.docker.internal:11434}
      AI_MODEL: ${AI_MODEL:-qwen2.5:7b}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      BAILIAN_API_KEY: ${BAILIAN_API_KEY:-}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      BAILIAN_MODEL: ${BAILIAN_MODEL:-qwen-plus}
      BAILIAN_EMBED_MODEL: ${BAILIAN_EMBED_MODEL:-text-embedding-v3}
      REDIS_URL: redis://redis:6379/0
      DB_POOL_SIZE: 20
      DB_MAX_OVERFLOW: 10
      IMPORT_CHUNK_SIZE: 500
    ports:
      - "3000:3000"
    volumes:
      # 上传的图片挂载出来，容器重启不丢
      - uploads_data:/app/uploads

  # ==================== 前端 ====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cuoti-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  db_data:
  uploads_data: